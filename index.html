<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1941 — 1945 · Великая Отечественная война</title>
<style>
:root{
  --accent:#c8a349;
  --accent-deep:#8f7320;
  --red:#b0413e;
  --course:#6a8ba8;
  --radius:8px;
  --radius-sm:5px;
  --transition:.22s cubic-bezier(.4,0,.2,1);
  --font-serif:'Georgia','Iowan Old Style','Times New Roman',serif;
  --font-sans:'Inter','Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono','Consolas',monospace;
}
html[data-theme="dark"]{
  --bg:#0d1014;
  --surface:#141a21;
  --surface-2:#181f27;
  --surface-3:#1c242e;
  --border:#242e3a;
  --border-strong:#333f4d;
  --text:#d5dce5;
  --text-muted:#8b98a8;
  --text-faint:#5c6775;
  --heading:#e8d9ac;
  --map-bg:#0a0d11;
  --correct-bg:#0f2418;
  --correct-border:#4b9c68;
  --wrong-bg:#261010;
  --wrong-border:#b0413e;
  --input-bg:#0a0d11;
  --input-border:#333f4d;
  --btn-bg:#c8a349;
  --btn-text:#1a1400;
  --shadow:0 2px 8px rgba(0,0,0,.35);
  --shadow-hover:0 6px 20px rgba(0,0,0,.5);
  --divider:linear-gradient(90deg,transparent,#333f4d 20%,#333f4d 80%,transparent);
  --hl-bg:rgba(242,214,117,.18);
  --hl-text:#f2d675;
}
html[data-theme="light"]{
  --bg:#f3efe6;
  --surface:#ffffff;
  --surface-2:#faf7f0;
  --surface-3:#f4efe3;
  --border:#e0d6c0;
  --border-strong:#c4b795;
  --text:#2a2f36;
  --text-muted:#5c6674;
  --text-faint:#8a94a1;
  --heading:#5a4520;
  --map-bg:#f8f5ee;
  --correct-bg:#eef7f0;
  --correct-border:#4b9c68;
  --wrong-bg:#fdeeee;
  --wrong-border:#b0413e;
  --input-bg:#ffffff;
  --input-border:#d8ccb2;
  --btn-bg:#8f7320;
  --btn-text:#ffffff;
  --shadow:0 1px 4px rgba(120,100,60,.08);
  --shadow-hover:0 4px 14px rgba(120,100,60,.15);
  --divider:linear-gradient(90deg,transparent,#d8ccb2 20%,#d8ccb2 80%,transparent);
  --hl-bg:rgba(200,163,73,.22);
  --hl-text:#8f7320;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  padding:2rem 1rem 4rem;
  min-height:100vh;
  transition:background-color var(--transition),color var(--transition);
}
.container{max-width:920px;margin:0 auto}

.theme-toggle{
  position:fixed;top:1.25rem;right:1.25rem;z-index:100;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--accent);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;box-shadow:var(--shadow);
  transition:all var(--transition);
}
.theme-toggle:hover{border-color:var(--accent);transform:rotate(20deg)}

header.page-header{
  text-align:center;
  margin-bottom:1.5rem;
  padding-bottom:1.25rem;
  position:relative;
}
header.page-header::after{
  content:"";
  position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:50%;height:1px;
  background:var(--divider);
}
header.page-header h1{
  font-family:var(--font-serif);
  font-size:clamp(1.8rem,5vw,2.6rem);
  font-weight:700;
  color:var(--heading);
  letter-spacing:.02em;
  margin-bottom:.4rem;
  line-height:1.15;
}
header.page-header .subtitle{
  font-size:.7rem;
  color:var(--text-faint);
  letter-spacing:.26em;
  text-transform:uppercase;
  font-weight:500;
}

/* ПОИСК — лупа через flex, без transform */
.search-box{position:relative;margin-bottom:1.5rem}
.search-input{
  width:100%;
  height:52px;
  padding:0 1rem 0 3.2rem;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:.9rem;
  transition:border-color var(--transition),box-shadow var(--transition);
}
.search-input::placeholder{color:var(--text-faint)}
.search-input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(200,163,73,.12);
}
.search-icon{
  position:absolute;
  left:16px;
  top:0;
  height:100%;
  width:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-faint);
  pointer-events:none;
}
.search-icon svg{width:18px;height:18px;display:block;flex-shrink:0}
.search-input:focus ~ .search-icon{color:var(--accent)}

.search-hint{
  display:flex;flex-wrap:wrap;gap:.4rem;
  margin-top:.65rem;padding-left:.2rem;
  font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);
}
.search-hint .hint-item{
  padding:.15rem .5rem;border:1px solid var(--border);
  border-radius:2px;cursor:pointer;transition:all var(--transition);
}
.search-hint .hint-item:hover{border-color:var(--accent);color:var(--accent)}

.year-section{margin-bottom:2.5rem}
.year-title{
  display:flex;align-items:baseline;gap:1rem;
  margin-bottom:1.25rem;padding-bottom:.6rem;
  border-bottom:1px solid var(--border);
}
.year-title .year-num{
  font-family:var(--font-serif);
  font-size:clamp(1.8rem,4.5vw,2.3rem);
  font-weight:700;color:var(--accent);line-height:1;
}
.year-title .year-label{
  font-size:.72rem;color:var(--text-faint);
  letter-spacing:.24em;text-transform:uppercase;font-weight:500;
}
.year-title .year-meta{
  margin-left:auto;font-family:var(--font-mono);
  font-size:.7rem;color:var(--text-faint);
}

.battle-item{
  display:flex;align-items:flex-start;gap:1rem;
  padding:1.3rem 1.45rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:.8rem;
  box-shadow:var(--shadow);cursor:pointer;
  position:relative;overflow:hidden;
  text-decoration:none;color:inherit;
  transition:border-color var(--transition),box-shadow var(--transition),transform var(--transition);
}
.battle-item::before{
  content:"";position:absolute;top:0;left:0;bottom:0;width:3px;
  background:var(--accent);opacity:.4;transition:opacity var(--transition);
}
.battle-item:hover{border-color:var(--border-strong);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.battle-item:hover::before{opacity:1}
.battle-item.hidden{display:none}

.battle-item .num{
  flex-shrink:0;font-family:var(--font-mono);font-size:.72rem;
  font-weight:700;color:var(--text-faint);
  padding:.3rem .6rem;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface-3);
  margin-top:.15rem;transition:color var(--transition),border-color var(--transition);
}
.battle-item:hover .num{color:var(--accent);border-color:var(--accent)}
.battle-item .body{flex:1;min-width:0}
.battle-item h3{
  font-family:var(--font-serif);
  font-size:clamp(1rem,2.4vw,1.15rem);
  font-weight:700;color:var(--text);
  line-height:1.35;margin-bottom:.35rem;
  transition:color var(--transition);
}
.battle-item:hover h3{color:var(--accent)}
.battle-item .date{
  font-family:var(--font-mono);font-size:.72rem;
  color:var(--text-faint);letter-spacing:.03em;
  display:block;margin-bottom:.3rem;
}
.battle-item .medinsky-line{
  font-family:var(--font-mono);font-size:.66rem;
  color:var(--accent-deep);letter-spacing:.03em;display:block;
}
.battle-item .go{
  flex-shrink:0;color:var(--text-faint);font-size:.9rem;
  margin-top:.35rem;transition:transform var(--transition),color var(--transition);
}
.battle-item:hover .go{color:var(--accent);transform:translateX(3px)}

mark.hl{
  background:var(--hl-bg);color:var(--hl-text);
  padding:0 .15em;border-radius:2px;font-weight:600;
}

.battle-page .back{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.55rem 1rem;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface);
  color:var(--text-muted);font-size:.76rem;font-weight:600;
  letter-spacing:.05em;cursor:pointer;
  transition:all var(--transition);margin-bottom:1.75rem;text-decoration:none;
}
.battle-page .back:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-2)}

.battle-page .page-title{
  margin-bottom:1.75rem;padding-bottom:1.25rem;
  border-bottom:1px solid var(--border);
}
.battle-page .page-title .num{
  font-family:var(--font-mono);font-size:.74rem;font-weight:700;
  color:var(--accent);letter-spacing:.06em;margin-bottom:.5rem;display:block;
}
.battle-page .page-title h1{
  font-family:var(--font-serif);
  font-size:clamp(1.35rem,3.8vw,1.9rem);
  font-weight:700;color:var(--heading);line-height:1.25;margin-bottom:.5rem;
}
.battle-page .page-title .date{
  font-family:var(--font-mono);font-size:.78rem;color:var(--text-faint);
}
.battle-page .page-title .medinsky-line{
  font-family:var(--font-mono);font-size:.72rem;
  color:var(--accent-deep);letter-spacing:.05em;margin-top:.5rem;display:block;
}

.section{
  margin-bottom:1.1rem;padding:.9rem 1.05rem;
  background:var(--surface);border:1px solid var(--border);
  border-left:2px solid var(--accent);border-radius:var(--radius-sm);
}
.section:last-child{margin-bottom:0}
.section.commanders{border-left-color:var(--accent)}
.section.course{border-left-color:var(--course)}
.section.outcome{border-left-color:var(--accent-deep);background:var(--surface-2)}
.section.map-section{border-left-color:var(--border-strong);padding:.55rem}
.section.tasks{border-left-color:var(--red);background:var(--surface-2)}

.section-label{
  display:flex;align-items:center;gap:.5rem;
  font-size:.66rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:.6rem;
}
.section-label::before{
  content:"";display:block;width:14px;height:1px;
  background:var(--accent);opacity:.7;
}
.section.commanders .section-label{color:var(--accent-deep)}
.section.course .section-label{color:var(--course)}
.section.outcome .section-label{color:var(--accent)}
.section.tasks .section-label{color:var(--red)}

.section-text{color:var(--text);font-size:.88rem;line-height:1.7}
.section-text + .section-text{margin-top:.6rem}
.names{font-family:var(--font-serif);font-style:italic;letter-spacing:.01em;font-size:.9rem}

.map-frame{
  border:1px solid var(--border);border-radius:var(--radius-sm);
  overflow:hidden;background:var(--map-bg);line-height:0;
}
.map-frame img{width:100%;height:auto;display:block;filter:saturate(.85) contrast(1.02);transition:transform .5s ease, filter .3s ease}
.map-frame:hover img{transform:scale(1.01);filter:saturate(1) contrast(1.05)}
.map-caption{
  font-size:.7rem;color:var(--text-faint);margin-top:.5rem;
  line-height:1.45;font-style:italic;font-family:var(--font-serif);
}

.task{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:.75rem .9rem;margin-bottom:.55rem;font-size:.85rem;
}
.task:last-child{margin-bottom:0}
.task-num{
  display:inline-block;font-family:var(--font-mono);font-size:.68rem;
  font-weight:700;color:var(--text-faint);border:1px solid var(--border-strong);
  border-radius:2px;padding:.05rem .35rem;margin-right:.4rem;vertical-align:middle;line-height:1.5;
}
.task-q{color:var(--text);line-height:1.6;margin-bottom:.55rem}
.answer-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.answer-input{
  flex:1;min-width:170px;padding:.5rem .7rem;
  border:1px solid var(--input-border);border-radius:var(--radius-sm);
  background:var(--input-bg);color:var(--text);
  font-size:.83rem;transition:border-color var(--transition),box-shadow var(--transition);
}
.answer-input::placeholder{color:var(--text-faint)}
.answer-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(200,163,73,.15)}
.answer-input.correct{border-color:var(--correct-border);background:var(--correct-bg)}
.answer-input.wrong{border-color:var(--wrong-border);background:var(--wrong-bg)}

.check-btn{
  padding:.5rem 1rem;border:none;border-radius:var(--radius-sm);
  background:var(--btn-bg);color:var(--btn-text);
  font-size:.75rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
  transition:all var(--transition);white-space:nowrap;
}
.check-btn:hover{filter:brightness(1.1);box-shadow:0 2px 8px rgba(200,163,73,.3)}
.check-btn:active{transform:translateY(1px)}

.result{
  margin-top:.55rem;padding:.5rem .7rem;border-radius:var(--radius-sm);
  font-size:.78rem;line-height:1.5;display:none;
  font-family:var(--font-mono);
}
.result.show{display:block}
.result.ok{background:var(--correct-bg);border-left:2px solid var(--correct-border);color:var(--text)}
.result.fail{background:var(--wrong-bg);border-left:2px solid var(--wrong-border);color:var(--text)}
.result .tag{font-weight:700;letter-spacing:.06em;margin-right:.4rem}
.result.ok .tag{color:var(--correct-border)}
.result.fail .tag{color:var(--wrong-border)}

footer{
  text-align:center;margin-top:3rem;padding-top:1.5rem;position:relative;
  font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);letter-spacing:.1em;
}
footer::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:50%;height:1px;background:var(--divider);
}

.view{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.no-results{
  text-align:center;padding:2.5rem 1rem;
  color:var(--text-faint);font-family:var(--font-mono);font-size:.8rem;
  display:none;
}
.no-results.show{display:block}
.no-results .big{
  display:block;font-family:var(--font-serif);font-size:1.4rem;
  color:var(--text-muted);margin-bottom:.5rem;
}

@media (max-width:640px){
  body{padding:1.2rem .65rem 3rem}
  .theme-toggle{width:38px;height:38px;font-size:1rem;top:.9rem;right:.9rem}
  .battle-item{padding:1.05rem 1.15rem;gap:.85rem}
  .battle-item .num{font-size:.68rem;padding:.25rem .5rem}
  .section{padding:.75rem .85rem}
  .section-text{font-size:.85rem}
  .answer-input{font-size:.8rem}
  .check-btn{font-size:.7rem;padding:.45rem .85rem}
  .year-title .year-meta{display:none}
  .search-input{height:48px;padding-left:3rem}
  .search-icon{left:14px}
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
  <span id="themeIcon">☀</span>
</button>

<div class="container">
  <div id="app"></div>
</div>

<script>
(function(){
  'use strict';

  /* ================================================================
     ДАННЫЕ — 29 битв, задания в формате ФИПИ
     ================================================================ */
  const BATTLES = [
    {
      id: 'brest', year: 1941, index: '01',
      title: 'Оборона Бреста',
      date: '22 июня — июль 1941',
      para: '§29 · С. 308–321',
      img: 'images/A.png',
      imgCaption: 'Схема обороны Брестской крепости, 1941 г.',
      commandersLabel: 'Участники',
      commanders: 'П.М. Гаврилов, И.Н. Зубачев, Е.М. Фомин, А.М. Кижеватов',
      course: [
        'Брестская крепость первой приняла удар немецких войск 22 июня 1941 года. Гарнизон, насчитывавший около 3,5 тысяч человек, оказался в полном окружении уже в первые часы войны. Немецкое командование, имея многократное превосходство в силах и артиллерии, рассчитывало взять крепость за несколько часов — к исходу первого дня наступления.',
        'Однако бойцы под командованием майора П.М. Гаврилова, капитана И.Н. Зубачева, полкового комиссара Е.М. Фомина и лейтенанта А.М. Кижеватова организовали упорную оборону. Штурмовые группы вермахта несли большие потери, захлёбываясь в узких коридорах и казематах. Крепость оборонялась не как обычный укреплённый пункт, а как настоящая крепость-цитадель.',
        'Отдельные группы защитников сражались в подвалах и казематах более месяца — до конца июля. На стенах крепости остались надписи: «Умираем, но не сдаёмся!», «Прощай, Родина!». Даже когда крепость официально была оставлена, в её развалинах продолжали биться одиночные бойцы.',
        'Оборона Брестской крепости стала символом стойкости и массового героизма советских солдат в первые, самые тяжёлые дни войны. Она показала, что план блицкрига даёт сбой с первых часов.'
      ],
      outcome: 'Сдача крепости. В 1965 году Брестской крепости присвоено звание «Крепость-герой».',
      tasks: [
        { q:'В обороне Брестской крепости важную роль сыграл ____________. (Введите фамилию)', answer:'гаврилов|п.м. гаврилов|п м гаврилов' },
        { q:'Заполните пропуск: «Оборона Брестской крепости началась в ______ 1941 года».', answer:'июне|июнь|июн' },
        { q:'В каком году Брестской крепости было присвоено звание «Крепость-герой»?', answer:'1965' },
        { q:'Укажите название реки, на которой расположена Брестская крепость.', answer:'западный буг|буг' },
        { q:'Установите соответствие: А) Начало обороны Брестской крепости — Б) Освобождение Бреста — В) Присвоение звания «Крепость-герой». Годы: 1) 1941 2) 1944 3) 1965. Ответьте цифрами через запятую.', answer:'1, 2, 3' }
      ]
    },
    {
      id: 'smolensk', year: 1941, index: '02',
      title: 'Смоленское сражение',
      date: '10 июля — 10 сентября 1941',
      para: '§29 · С. 308–321',
      img: 'images/B.jpg',
      imgCaption: 'Карта боевых действий на Смоленском направлении, 1941 г.',
      commandersLabel: 'Командующие',
      commanders: 'С.К. Тимошенко (Западный фронт), В.Я. Качалов, В.А. Хоменко, С.А. Калинин, И.И. Масленников, К.К. Рокоссовский, А.И. Еременко (Брянский фронт)',
      course: [
        'Смоленское сражение стало одним из крупнейших оборонительных и наступательных сражений первого периода войны. Немецкая группа армий «Центр» стремилась кратчайшим путём прорваться к Москве через Смоленск — «ключ-город» на пути к столице.',
        'Советские войска Западного, Резервного и Брянского фронтов вели тяжёлые оборонительные бои, постоянно контратакуя. В районе Смоленска развернулось крупное танковое сражение, в котором с обеих сторон участвовали сотни машин.',
        'Особую роль сыграли соединения под командованием К.К. Рокоссовского и А.И. Еременко. В ходе сражения советское командование впервые применило новые артиллерийские и танковые соединения, а также впервые провело крупную наступательную операцию — Рославльско-Новозыбковскую.',

    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="11" cy="11" r="7"></circle>' +
      '<line x1="20" y1="20" x2="16.5" y2="16.5"></line>' +
    '</svg>';

  /* ================================================================
     ЭКРАН 1 — ГЛАВНАЯ
     ================================================================ */
  function renderIndex(){
    const root = $('#app');
    root.innerHTML = '';

    const wrap = el('div', 'view');

    const header = el('header', 'page-header');
    header.innerHTML =
      '<h1>1941 — 1945</h1>' +
      '<p class="subtitle">Великая Отечественная война</p>';
    wrap.appendChild(header);

    const searchBox = el('div', 'search-box');
    searchBox.innerHTML =
      '<input type="text" class="search-input" id="searchInput" ' +
      'placeholder="Поиск: битва, командующий, §33, страница 374..." ' +
      'autocomplete="off">' +
      '<span class="search-icon">' + SEARCH_ICON_SVG + '</span>' +
      '<div class="search-hint">' +
        '<span class="hint-item" data-q="Сталинград">Сталинград</span>' +
        '<span class="hint-item" data-q="Жуков">Жуков</span>' +
        '<span class="hint-item" data-q="§33">§33</span>' +
        '<span class="hint-item" data-q="374">374</span>' +
        '<span class="hint-item" data-q="1944">1944</span>' +
      '</div>';
    wrap.appendChild(searchBox);

    const byYear = {};
    BATTLES.forEach(b => {
      if(!byYear[b.year]) byYear[b.year] = [];
      byYear[b.year].push(b);
    });

    const listRoot = el('div', 'battles-list');

    Object.keys(byYear).sort().forEach(year => {
      const section = el('section', 'year-section');
      section.dataset.year = year;

      const h2 = el('h2', 'year-title');
      h2.innerHTML =
        '<span class="year-num">' + year + '</span>' +
        '<span class="year-label">' + yearLabels[year] + '</span>' +
        '<span class="year-meta">' + byYear[year].length + ' сражений</span>';
      section.appendChild(h2);

      byYear[year].forEach(b => {
        const searchText = (
          b.title + ' ' + b.date + ' ' + b.commanders + ' ' +
          b.outcome + ' ' + b.course.join(' ') + ' ' + b.para
        ).toLowerCase();

        const card = el('a', 'battle-item');
        card.href = '#/battle/' + b.id;
        card.dataset.search = searchText;

        card.innerHTML =
          '<span class="num">№ ' + b.index + '</span>' +
          '<div class="body">' +
            '<h3 class="card-title">' + escapeHtml(b.title) + '</h3>' +
            '<span class="date card-date">' + escapeHtml(b.date) + '</span>' +
            '<span class="medinsky-line card-para">' + escapeHtml(b.para) + '</span>' +
          '</div>' +
          '<span class="go">→</span>';
        section.appendChild(card);
      });

      listRoot.appendChild(section);
    });

    wrap.appendChild(listRoot);

    const noResults = el('div', 'no-results');
    noResults.id = 'noResults';
    noResults.innerHTML =
      '<span class="big">Ничего не найдено</span>' +
      'Попробуйте изменить запрос.';
    wrap.appendChild(noResults);

    const footer = el('footer');
    footer.textContent = '1941 — 1945';
    wrap.appendChild(footer);

    root.appendChild(wrap);

    initSearch();
  }

  function initSearch(){
    const input = $('#searchInput');
    if(!input) return;

    const cards = $$('.battle-item');
    const sections = $$('.year-section');
    const noResults = $('#noResults');
    const hints = $$('.hint-item');

    cards.forEach(card => {
      const titleEl = card.querySelector('.card-title');
      const dateEl  = card.querySelector('.card-date');
      const paraEl  = card.querySelector('.card-para');
      titleEl.dataset.orig = titleEl.textContent;
      dateEl.dataset.orig  = dateEl.textContent;
      paraEl.dataset.orig  = paraEl.textContent;
    });

    function highlight(text, query){
      if(!query) return escapeHtml(text);
      const safeText = escapeHtml(text);
      const re = new RegExp('(' + escapeRegex(escapeHtml(query)) + ')', 'gi');
      return safeText.replace(re, '<mark class="hl">$1</mark>');
    }

    function findMatch(origText, query){
      const test = origText.toLowerCase().replace(/ё/g,'е');
      const q = query.toLowerCase().replace(/ё/g,'е');
      const idx = test.indexOf(q);
      if(idx < 0) return null;
      return { start: idx, end: idx + q.length };
    }

    function makeSnippet(origText, query){
      const m = findMatch(origText, query);
      if(!m) return escapeHtml(origText);
      const before = origText.slice(0, m.start);
      const found  = origText.slice(m.start, m.end);
      const after  = origText.slice(m.end);
      const beforeShort = before.length > 14 ? '…' + before.slice(-14) : before;
      const afterShort  = after.length  > 14 ? after.slice(0, 14) + '…' : after;
      return escapeHtml(beforeShort) +
             '<mark class="hl">' + escapeHtml(found) + '</mark>' +
             escapeHtml(afterShort);
    }

    function applyFilter(){
      const raw = input.value.trim();
      const q = raw.toLowerCase().replace(/ё/g, 'е');
      let visibleCount = 0;

      cards.forEach(card => {
        const text = (card.dataset.search || '').replace(/ё/g, 'е');
        const titleEl = card.querySelector('.card-title');
        const dateEl  = card.querySelector('.card-date');
        const paraEl  = card.querySelector('.card-para');

        const match = !q || text.includes(q);

        if(match){
          card.classList.remove('hidden');
          visibleCount++;

          if(q){
            const titleOrig = titleEl.dataset.orig;
            const titleMatch = findMatch(titleOrig, raw);
            if(titleMatch && titleOrig.length > 40){
              titleEl.innerHTML = makeSnippet(titleOrig, raw);
            } else {
              titleEl.innerHTML = titleMatch
                ? highlight(titleOrig, raw)
                : escapeHtml(titleOrig);
            }

            const dateOrig = dateEl.dataset.orig;
            dateEl.innerHTML = findMatch(dateOrig, raw)
              ? highlight(dateOrig, raw)
              : escapeHtml(dateOrig);

            const paraOrig = paraEl.dataset.orig;
            paraEl.innerHTML = findMatch(paraOrig, raw)
              ? highlight(paraOrig, raw)
              : escapeHtml(paraOrig);
          } else {
            titleEl.textContent = titleEl.dataset.orig;
            dateEl.textContent  = dateEl.dataset.orig;
            paraEl.textContent  = paraEl.dataset.orig;
          }
        } else {
          card.classList.add('hidden');
        }
      });

      sections.forEach(sec => {
        const visible = sec.querySelectorAll('.battle-item:not(.hidden)').length;
        sec.style.display = visible === 0 ? 'none' : '';
      });

      noResults.classList.toggle('show', visibleCount === 0);
    }

    input.addEventListener('input', applyFilter);
    hints.forEach(h => {
      h.addEventListener('click', () => {
        input.value = h.dataset.q;
        input.focus();
        applyFilter();
      });
    });
  }

  /* ================================================================
     ЭКРАН 2 — СТРАНИЦА БИТВЫ
     ================================================================ */
  function renderBattle(id){
    const b = findBattle(id);
    if(!b){ location.hash = ''; return; }

    const root = $('#app');
    root.innerHTML = '';

    const wrap = el('div', 'view battle-page');

    const back = el('a', 'back');
    back.href = '#/';
    back.innerHTML = '← Назад к хронике';
    wrap.appendChild(back);

    const titleBox = el('div', 'page-title');
    titleBox.innerHTML =
      '<span class="num">№ ' + b.index + ' · ' + b.year + '</span>' +
      '<h1>' + escapeHtml(b.title) + '</h1>' +
      '<div class="date">' + escapeHtml(b.date) + '</div>' +
      '<span class="medinsky-line">' + escapeHtml(b.para) + '</span>';
    wrap.appendChild(titleBox);

    const cmd = el('div', 'section commanders');
    cmd.innerHTML =
      '<div class="section-label">' + escapeHtml(b.commandersLabel) + '</div>' +
      '<p class="section-text names">' + escapeHtml(b.commanders) + '</p>';
    wrap.appendChild(cmd);

    const course = el('div', 'section course');
    let courseHTML = '<div class="section-label">Ход битвы</div>';
    b.course.forEach(p => {
      courseHTML += '<p class="section-text">' + escapeHtml(p) + '</p>';
    });
    course.innerHTML = courseHTML;
    wrap.appendChild(course);

    const map = el('div', 'section map-section');
    map.innerHTML =
      '<div class="section-label">Карта-схема</div>' +
      '<div class="map-frame">' +
        '<img src="' + b.img + '" alt="' + escapeHtml(b.title) + '" loading="lazy">' +
      '</div>' +
      '<p class="map-caption">' + escapeHtml(b.imgCaption) + '</p>';
    wrap.appendChild(map);

    const outcome = el('div', 'section outcome');
    outcome.innerHTML =
      '<div class="section-label">Итог</div>' +
      '<p class="section-text">' + escapeHtml(b.outcome) + '</p>';
    wrap.appendChild(outcome);

    const tasks = el('div', 'section tasks');
    let tasksHTML = '<div class="section-label">Задания в формате ФИПИ</div>';
    b.tasks.forEach((t, i) => {
      tasksHTML +=
        '<div class="task" data-answer="' + escapeHtml(t.answer) + '">' +
          '<p class="task-q"><span class="task-num">' +
            String(i+1).padStart(2,'0') +
          '</span>' + escapeHtml(t.q) + '</p>' +
          '<div class="answer-row">' +
            '<input type="text" class="answer-input" placeholder="Введите ответ...">' +
            '<button class="check-btn">Проверить</button>' +
          '</div>' +
          '<div class="result"></div>' +
        '</div>';
    });
    tasks.innerHTML = tasksHTML;
    wrap.appendChild(tasks);

    const footer = el('footer');
    footer.textContent = '1941 — 1945 · ' + b.index;
    wrap.appendChild(footer);

    root.appendChild(wrap);
    window.scrollTo({top:0, behavior:'instant'});

    initTaskChecks();
  }

  function normalize(s){
    return s
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[«»"']/g, '')
      .replace(/\s+/g, ' ')
      .replace(/[.,;:!?]/g, '')
      .trim();
  }

  function initTaskChecks(){
    $$('.task').forEach(task => {
      const input = task.querySelector('.answer-input');
      const btn = task.querySelector('.check-btn');
      const result = task.querySelector('.result');
      const correct = task.getAttribute('data-answer').split('|');

      function check(){
        const user = normalize(input.value);
        if(!user){
          result.className = 'result show fail';
          result.innerHTML = '<span class="tag">ВНИМАНИЕ</span> Введите ответ.';
          return;
        }
        const ok = correct.some(a => normalize(a) === user);
        input.classList.remove('correct','wrong');
        if(ok){
          input.classList.add('correct');
          result.className = 'result show ok';
          result.innerHTML = '<span class="tag">ВЕРНО</span>';
        } else {
          input.classList.add('wrong');
          result.className = 'result show fail';
          result.innerHTML =
            '<span class="tag">НЕВЕРНО</span> Правильный ответ: <strong>' +
            escapeHtml(correct[0]) + '</strong>';
        }
      }

      btn.addEventListener('click', check);
      input.addEventListener('keypress', e => {
        if(e.key === 'Enter') check();
      });
      input.addEventListener('input', () => {
        input.classList.remove('correct','wrong');
        result.className = 'result';
        result.innerHTML = '';
      });
    });
  }

  function route(){
    const hash = location.hash || '#/';
    const m = hash.match(/^#\/battle\/(.+)$/);
    if(m){
      renderBattle(m[1]);
    } else {
      renderIndex();
    }
  }

  window.addEventListener('hashchange', route);
  route();

  const themeToggle = $('#themeToggle');
  const themeIcon = $('#themeIcon');
  const htmlEl = document.documentElement;

  function applyTheme(theme){
    htmlEl.setAttribute('data-theme', theme);
    themeIcon.textContent = (theme === 'dark') ? '☀' : '☾';
    try { localStorage.setItem('theme', theme); } catch(e){}
  }
  let saved = 'dark';
  try { saved = localStorage.getItem('theme') || 'dark'; } catch(e){}
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    applyTheme(htmlEl.ge+79180189792tAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

})();
</script>
