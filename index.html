<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хроника Великой Отечественной войны 1941–1945</title>
<style>
:root{
  --accent:#c9a227;
  --accent-deep:#a8841a;
  --course-color:#4a7a9c;
  --radius-lg:14px;
  --radius-md:10px;
  --radius-sm:6px;
  --transition:.28s cubic-bezier(.4,0,.2,1);
  --font-main:Georgia,'Times New Roman',serif;
  --font-ui:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1116;
  --bg-gradient:radial-gradient(ellipse at top,#171d26 0%,#0b0e12 75%);
  --surface:#151a21;
  --surface-hover:#1a2029;
  --surface-alt:#10151b;
  --border:#232b36;
  --border-hover:#2f3947;
  --text:#dde3ea;
  --text-muted:#8b96a5;
  --text-faint:#5d6875;
  --heading:#e8d5a8;
  --year-color:#d4b96a;
  --shadow:0 4px 18px rgba(0,0,0,.4);
  --shadow-hover:0 8px 28px rgba(0,0,0,.55);
  --badge-bg:#232b36;
  --badge-text:#b8c2cf;
  --outcome-bg:#141d18;
  --course-bg:#111a22;
  --divider:linear-gradient(90deg,transparent,#2f3947,transparent);
  --toggle-bg:#151a21;
  --toggle-color:#d4b96a;
  --map-bg:#0d1116;
  --resize-bg:#1a2029;
  --resize-bg-hover:#232b36;
  --resize-icon:#8b96a5;
  --resize-icon-hover:#c9a227;
  --task-bg:#131a22;
  --input-bg:#0b0f14;
  --input-border:#2f3947;
  --input-focus:#c9a227;
  --correct-bg:#0f2a1a;
  --correct-border:#4a9c6a;
  --wrong-bg:#2a1010;
  --wrong-border:#c0392b;
  --btn-bg:#c9a227;
  --btn-text:#1a1500;
}
html[data-theme="light"]{
  --bg:#f4f1ea;
  --bg-gradient:radial-gradient(ellipse at top,#faf8f3 0%,#eae4d8 75%);
  --surface:#ffffff;
  --surface-hover:#fdfbf7;
  --surface-alt:#f7f4ed;
  --border:#e4dccb;
  --border-hover:#cfc2a5;
  --text:#2a2f36;
  --text-muted:#5f6b7a;
  --text-faint:#8a94a3;
  --heading:#5a4520;
  --year-color:#8a6a1f;
  --shadow:0 4px 16px rgba(120,100,60,.1);
  --shadow-hover:0 8px 26px rgba(120,100,60,.18);
  --badge-bg:#f2ecdd;
  --badge-text:#6b5a35;
  --outcome-bg:#f6f2e3;
  --course-bg:#eef4f8;
  --divider:linear-gradient(90deg,transparent,#d8ccb2,transparent);
  --toggle-bg:#ffffff;
  --toggle-color:#b8860b;
  --map-bg:#f0ece2;
  --resize-bg:#f7f4ed;
  --resize-bg-hover:#eef4f8;
  --resize-icon:#8a94a3;
  --resize-icon-hover:#b8860b;
  --task-bg:#fbf8f1;
  --input-bg:#ffffff;
  --input-border:#d8ccb2;
  --input-focus:#b8860b;
  --correct-bg:#eef7f0;
  --correct-border:#4a9c6a;
  --wrong-bg:#fdeeee;
  --wrong-border:#c0392b;
  --btn-bg:#b8860b;
  --btn-text:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  background-image:var(--bg-gradient);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.6;
  padding:2rem 1rem 4rem;
  min-height:100vh;
  transition:background-color var(--transition),color var(--transition);
}
.container{max-width:960px;margin:0 auto}

.theme-toggle{
  position:fixed;top:1.25rem;right:1.25rem;z-index:100;
  width:48px;height:48px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--toggle-bg);
  color:var(--toggle-color);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  box-shadow:var(--shadow);
  transition:transform var(--transition),background-color var(--transition),
             border-color var(--transition),box-shadow var(--transition),color var(--transition);
}
.theme-toggle:hover{transform:scale(1.08);border-color:var(--accent);box-shadow:var(--shadow-hover)}
.theme-toggle:active{transform:scale(.94)}

header{text-align:center;margin-bottom:2.5rem;padding-bottom:1.5rem;position:relative}
header::after{
  content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:50%;height:1px;background:var(--divider);
}
.header-emblem{font-size:1.8rem;margin-bottom:.4rem;color:var(--accent);opacity:.9}
header h1{
  font-family:var(--font-main);
  font-size:clamp(1.5rem,4vw,2.2rem);
  font-weight:700;letter-spacing:.3px;color:var(--heading);
  margin-bottom:.5rem;
}
header .subtitle{
  color:var(--text-faint);font-size:clamp(.78rem,2vw,.95rem);
  font-style:italic;letter-spacing:1.2px;text-transform:uppercase;
}
header .years{
  display:inline-block;margin-top:.9rem;padding:.3rem 1.1rem;
  border:1px solid var(--border);border-radius:30px;color:var(--accent);
  font-size:.78rem;letter-spacing:2.5px;font-weight:600;
}

.controls{display:flex;justify-content:center;gap:.6rem;margin-bottom:2rem;flex-wrap:wrap}
.control-btn{
  padding:.45rem 1rem;border-radius:30px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);
  font-size:.78rem;font-weight:600;letter-spacing:.3px;cursor:pointer;
  transition:all var(--transition);font-family:var(--font-ui);
}
.control-btn:hover{
  border-color:var(--accent);color:var(--accent);
  background:var(--surface-hover);box-shadow:var(--shadow);
}

.year-section{margin-bottom:2.5rem}
.year-title{
  font-family:var(--font-main);
  font-size:clamp(1.3rem,3.5vw,1.7rem);
  font-weight:700;color:var(--year-color);
  margin-bottom:1.2rem;padding-left:.9rem;
  position:relative;letter-spacing:.3px;
  display:flex;align-items:center;gap:.7rem;
}
.year-title::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:75%;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
}
.year-title .year-line{flex:1;height:1px;background:var(--divider)}

.battle-item{
  background:var(--surface);
  border-radius:var(--radius-lg);
  margin-bottom:.75rem;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  transition:transform var(--transition),box-shadow var(--transition),
             border-color var(--transition),background-color var(--transition);
}
.battle-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--border-hover)}
.battle-item.open{border-color:var(--accent)}
.battle-header{
  display:flex;align-items:center;gap:.9rem;
  padding:1rem 1.3rem;
  cursor:pointer;user-select:none;
  background:var(--surface);
  border-radius:var(--radius-lg);
  transition:background-color var(--transition);
  position:relative;
}
.battle-header:hover{background:var(--surface-hover)}
.battle-item.open .battle-header{background:var(--surface-hover);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.battle-index{
  flex-shrink:0;width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  color:#fff;font-weight:700;font-size:.78rem;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(201,162,39,.3);
  transition:transform var(--transition);
}
.battle-item.open .battle-index{transform:scale(1.08)}
.battle-title-wrap{flex:1;min-width:0}
.battle-header h3{
  font-family:var(--font-main);
  font-size:clamp(.92rem,2.3vw,1.08rem);
  font-weight:700;color:var(--text);
  line-height:1.35;margin-bottom:.2rem;
  transition:color var(--transition);
}
.battle-item.open .battle-header h3{color:var(--accent)}
.date-badge{
  display:inline-block;background:var(--badge-bg);color:var(--badge-text);
  font-size:.68rem;padding:.15rem .6rem;border-radius:14px;
  font-weight:600;letter-spacing:.3px;
}
.arrow{
  flex-shrink:0;font-size:.85rem;color:var(--text-muted);
  transition:transform var(--transition),color var(--transition);
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:1px solid var(--border);background:var(--surface-alt);
}
.battle-item.open .arrow{
  transform:rotate(180deg);
  color:var(--accent);border-color:var(--accent);
}

.battle-details{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1);
  background:var(--surface-alt);
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  overflow:hidden;
}
.battle-item.open .battle-details{grid-template-rows:1fr}
.battle-details-inner{
  min-height:0;
  padding:0 1.3rem;
  border-top:1px solid transparent;
  transition:padding .3s ease,border-color .3s ease;
  position:relative;
  display:flex;
  flex-direction:column;
}
.battle-item.open .battle-details-inner{
  padding:1.2rem 1.3rem 0;
  border-top-color:var(--border);
}
.scroll-content{
  max-height:450px;
  overflow-y:auto;
  padding-right:.5rem;
  padding-bottom:.5rem;
  transition:max-height .15s ease;
  overscroll-behavior:contain;
}
.scroll-content::-webkit-scrollbar{width:8px}
.scroll-content::-webkit-scrollbar-track{background:transparent}
.scroll-content::-webkit-scrollbar-thumb{
  background:var(--border-hover);border-radius:4px;
}
.scroll-content::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ===== РУЧКА РЕСАЙЗА (новая, заметная) ===== */
.resize-handle{
  height:34px;
  margin:0 -.3rem;
  background:var(--resize-bg);
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  cursor:ns-resize;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.35rem;
  position:relative;
  user-select:none;
  flex-shrink:0;
  border-top:1px solid var(--border);
  transition:background-color .2s ease;
  /* Ключевое: блокирует прокрутку страницы при touch-жестах на ручке */
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
.resize-handle:hover,
.resize-handle.dragging{
  background:var(--resize-bg-hover);
}
.resize-handle .resize-icon{
  font-size:.85rem;
  color:var(--resize-icon);
  transition:color .2s ease,transform .2s ease;
  line-height:1;
}
.resize-handle .resize-label{
  font-size:.68rem;
  letter-spacing:.4px;
  color:var(--resize-icon);
  font-weight:600;
  transition:color .2s ease;
  white-space:nowrap;
}
.resize-handle:hover .resize-icon,
.resize-handle:hover .resize-label,
.resize-handle.dragging .resize-icon,
.resize-handle.dragging .resize-label{
  color:var(--resize-icon-hover);
}
.resize-handle:hover .icon-up,
.resize-handle.dragging .icon-up{transform:translateY(-2px)}
.resize-handle:hover .icon-down,
.resize-handle.dragging .icon-down{transform:translateY(2px)}

.detail-section{
  margin-bottom:1rem;padding:.85rem 1rem;
  border-radius:var(--radius-md);
  background:var(--surface);
  border:1px solid var(--border);
}
.detail-section:last-child{margin-bottom:0}
.detail-section.commanders{border-left:3px solid var(--accent)}
.detail-section.course{border-left:3px solid var(--course-color);background:var(--course-bg)}
.detail-section.outcome{border-left:3px solid var(--accent);background:var(--outcome-bg)}
.detail-section.map-section{
  border-left:3px solid var(--border-hover);
  background:var(--map-bg);
  padding:.6rem;
}
.detail-section.quiz-section-fipi{
  border-left:3px solid var(--accent-deep);
  background:var(--task-bg);
}
.section-label{
  display:flex;align-items:center;gap:.45rem;
  font-weight:700;font-size:.74rem;letter-spacing:1.1px;
  text-transform:uppercase;margin-bottom:.55rem;
}
.commanders .section-label{color:var(--accent-deep)}
.course .section-label{color:var(--course-color)}
.outcome .section-label{color:var(--accent-deep)}
.map-section .section-label{color:var(--text-faint)}
.quiz-section-fipi .section-label{color:var(--accent-deep)}
.section-label .icon{font-size:.95rem;line-height:1}
.detail-text{color:var(--text);font-size:.9rem;line-height:1.7;text-align:justify;hyphens:auto}
.detail-text + .detail-text{margin-top:.55rem}
.detail-text.names{font-family:var(--font-main);font-style:italic;letter-spacing:.1px}
.map-frame{
  position:relative;
  border-radius:var(--radius-sm);
  overflow:hidden;
  border:1px solid var(--border);
  background:var(--map-bg);
  line-height:0;
}
.map-frame img{width:100%;height:auto;display:block;transition:transform .5s ease}
.map-frame:hover img{transform:scale(1.02)}
.map-caption{
  font-size:.72rem;color:var(--text-faint);
  margin-top:.45rem;line-height:1.4;font-style:italic;
}

/* ===== ЗАДАНИЯ ===== */
.fipi-task{
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);
  padding:.85rem .95rem;
  margin-bottom:.8rem;
  font-size:.85rem;
  line-height:1.55;
}
.fipi-task:last-child{margin-bottom:0}
.fipi-task .task-text{
  color:var(--text);
  margin-bottom:.45rem;
}
.fipi-task .task-text strong{color:var(--accent-deep)}
.fipi-task .task-body{
  color:var(--text);
  margin-bottom:.5rem;
  padding-left:.3rem;
}
.fipi-task .task-list{
  color:var(--text-muted);
  margin-bottom:.6rem;
  padding:.5rem .7rem;
  font-size:.8rem;
  background:var(--surface-alt);
  border-radius:var(--radius-sm);
}
.fipi-task .task-list strong{color:var(--accent-deep)}
.answer-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.4rem}
.answer-input{
  flex:1;min-width:180px;
  padding:.5rem .75rem;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--input-border);
  background:var(--input-bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:.85rem;
  transition:border-color var(--transition),box-shadow var(--transition);
}
.answer-input:focus{
  outline:none;
  border-color:var(--input-focus);
  box-shadow:0 0 0 3px rgba(201,162,39,.15);
}
.answer-input.correct{border-color:var(--correct-border);background:var(--correct-bg)}
.answer-input.wrong{border-color:var(--wrong-border);background:var(--wrong-bg)}
.check-btn{
  padding:.5rem 1rem;border-radius:var(--radius-sm);border:none;
  background:var(--btn-bg);color:var(--btn-text);
  font-family:var(--font-ui);font-size:.8rem;font-weight:700;
  letter-spacing:.3px;cursor:pointer;white-space:nowrap;
  transition:transform var(--transition),box-shadow var(--transition);
}
.check-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(201,162,39,.3)}
.check-btn:active{transform:translateY(0)}
.answer-result{
  margin-top:.55rem;padding:.55rem .75rem;
  border-radius:var(--radius-sm);font-size:.82rem;line-height:1.5;
  display:none;
}
.answer-result.show{display:block}
.answer-result.ok{background:var(--correct-bg);border-left:3px solid var(--correct-border);color:var(--text)}
.answer-result.fail{background:var(--wrong-bg);border-left:3px solid var(--wrong-border);color:var(--text)}
.answer-result .label{font-weight:700;margin-right:.35rem}
.answer-result.ok .label{color:#4a9c6a}
.answer-result.fail .label{color:#c0392b}

@media (max-width:680px){
  body{padding:1.2rem .7rem 3rem}
  .theme-toggle{width:42px;height:42px;font-size:1.15rem;top:.9rem;right:.9rem}
  .battle-header{padding:.85rem 1rem;gap:.7rem}
  .battle-index{width:28px;height:28px;font-size:.7rem}
  .battle-details-inner{padding-left:1rem;padding-right:1rem}
  .battle-item.open .battle-details-inner{padding:1rem 1rem 0}
  .detail-section{padding:.7rem .8rem}
  .detail-text{font-size:.85rem;text-align:left}
  .arrow{width:24px;height:24px;font-size:.75rem}
  .scroll-content{max-height:320px}
  .fipi-task{font-size:.78rem;padding:.65rem .75rem}
  .answer-input{font-size:.8rem;padding:.45rem .6rem}
  .check-btn{font-size:.75rem;padding:.45rem .85rem}
  .resize-handle{height:40px}
  .resize-handle .resize-label{font-size:.65rem}
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Переключить тему">
  <span id="themeIcon">☀️</span>
</button>

<div class="container">
  <header>
    <div class="header-emblem">★</div>
    <h1>Хроника Великой Отечественной войны</h1>
    <p class="subtitle">Битвы · Командующие · Ход · Итоги · Задания ФИПИ</p>
    <span class="years">1941 — 1945</span>
  </header>

  <div class="controls">
    <button class="control-btn" id="expandAll">Раскрыть все</button>
    <button class="control-btn" id="collapseAll">Свернуть все</button>
  </div>

  <div id="battles-root"></div>
</div>

<script>
(function(){
  'use strict';

  /* ================================================================
     ДАННЫЕ ВСЕХ БИТВ
     ================================================================ */
  const BATTLES = [
    /* ============ 1941 ============ */
    {
      year: 1941,
      index: '01',
      title: 'Оборона Бреста',
      date: '22 июня – июль 1941',
      img: 'images/A.png',
      imgCaption: 'Схема обороны Брестской крепости, 1941 г.',
      commandersLabel: 'Участники',
      commanders: 'П.М. Гаврилов, И.Н. Зубачев, Е.М. Фомин, А.М. Кижеватов',
      course: [
        'Брестская крепость первой приняла удар немецких войск 22 июня 1941 года. Гарнизон, насчитывавший около 3,5 тысяч человек, оказался в полном окружении уже в первые часы войны. Немецкое командование, имея многократное превосходство в силах и артиллерии, рассчитывало взять крепость за несколько часов — к исходу первого дня наступления.',
        'Однако бойцы под командованием майора П.М. Гаврилова, капитана И.Н. Зубачева, полкового комиссара Е.М. Фомина и лейтенанта А.М. Кижеватова организовали упорную оборону. Штурмовые группы вермахта несли большие потери, захлёбываясь в узких коридорах и казематах. Крепость оборонялась не как обычный укреплённый пункт, а как настоящая крепость-цитадель.',
        'Отдельные группы защитников сражались в подвалах и казематах более месяца — до конца июля. На стенах крепости остались надписи: «Умираем, но не сдаёмся!», «Прощай, Родина!». Даже когда крепость официально была оставлена, в её развалинах продолжали биться одиночные бойцы.',
        'Оборона Брестской крепости стала символом стойкости и массового героизма советских солдат в первые, самые тяжёлые дни войны. Она показала, что план блицкрига даёт сбой с первых часов.'
      ],
      outcome: 'Сдача крепости. В 1965 году Брестской крепости присвоено звание «Крепость-герой».',
      tasks: [
        { q:'Заполните пропуск: «Оборона Брестской крепости началась в ______ 1941 года».', answer:'июне|июнь|июн' },
        { q:'Укажите фамилию майора, руководившего обороной Восточного форта Брестской крепости.', answer:'гаврилов|п.м. гаврилов|п м гаврилов' },
        { q:'В каком году Брест был освобождён советскими войсками?', answer:'1944|1944 г|1944 год' },
        { q:'Укажите название реки, на которой расположена Брестская крепость.', answer:'западный буг|западныйбуг|буг' },
        { q:'Назовите дату начала обороны Брестской крепости.', answer:'22 июня|22 июня 1941|22.06.1941' },
        { q:'В каком году Брестской крепости было присвоено звание «Крепость-герой»?', answer:'1965' },
        { q:'Назовите фамилию полкового комиссара — одного из руководителей обороны Брестской крепости.', answer:'фомин|е.м. фомин|е м фомин' },
        { q:'На территории какой республики находится Брестская крепость?', answer:'белоруссия|беларусь|бсср' }
      ]

  /* ================================================================
     РЕНДЕР
     ================================================================ */
  const root = document.getElementById('battles-root');
  const yearTitles = {
    1941: '1941 год',
    1942: '1942 год',
    1943: '1943 год',
    1944: '1944 год · Десять «сталинских ударов»',
    1945: '1945 год'
  };

  // Группируем по годам
  const byYear = {};
  BATTLES.forEach(function(b){
    if(!byYear[b.year]) byYear[b.year] = [];
    byYear[b.year].push(b);
  });

  Object.keys(byYear).sort().forEach(function(year){
    const section = document.createElement('section');
    section.className = 'year-section';

    const h2 = document.createElement('h2');
    h2.className = 'year-title';
    h2.innerHTML = yearTitles[year] + ' <span class="year-line"></span>';
    section.appendChild(h2);

    byYear[year].forEach(function(b){
      const item = document.createElement('div');
      item.className = 'battle-item';

      // Заголовок
      const header = document.createElement('div');
      header.className = 'battle-header';
      header.innerHTML =
        '<span class="battle-index">' + b.index + '</span>' +
        '<div class="battle-title-wrap">' +
          '<h3>' + b.title + '</h3>' +
          '<span class="date-badge">' + b.date + '</span>' +
        '</div>' +
        '<span class="arrow">▼</span>';
      item.appendChild(header);

      // Содержимое
      const details = document.createElement('div');
      details.className = 'battle-details';
      const inner = document.createElement('div');
      inner.className = 'battle-details-inner';
      const scroll = document.createElement('div');
      scroll.className = 'scroll-content';

      // Командующие
      scroll.insertAdjacentHTML('beforeend',
        '<div class="detail-section commanders">' +
          '<div class="section-label"><span class="icon">⚔</span> ' + b.commandersLabel + '</div>' +
          '<p class="detail-text names">' + b.commanders + '</p>' +
        '</div>'
      );

      // Ход битвы (несколько абзацев)
      let courseHTML = '<div class="detail-section course">' +
        '<div class="section-label"><span class="icon">📜</span> Ход битвы</div>';
      b.course.forEach(function(par){
        courseHTML += '<p class="detail-text">' + par + '</p>';
      });
      courseHTML += '</div>';
      scroll.insertAdjacentHTML('beforeend', courseHTML);

      // Карта
      scroll.insertAdjacentHTML('beforeend',
        '<div class="detail-section map-section">' +
          '<div class="section-label"><span class="icon">🗺</span> Карта-схема</div>' +
          '<div class="map-frame">' +
            '<img src="' + b.img + '" alt="' + b.title + '" loading="lazy">' +
          '</div>' +
          '<p class="map-caption">' + b.imgCaption + '</p>' +
        '</div>'
      );

      // Итог
      scroll.insertAdjacentHTML('beforeend',
        '<div class="detail-section outcome">' +
          '<div class="section-label"><span class="icon">✦</span> Итог</div>' +
          '<p class="detail-text">' + b.outcome + '</p>' +
        '</div>'
      );

      // Задания
      let tasksHTML = '<div class="detail-section quiz-section-fipi">' +
        '<div class="section-label"><span class="icon">📝</span> Задания в формате ФИПИ</div>';
      b.tasks.forEach(function(t, i){
        tasksHTML +=
          '<div class="fipi-task" data-answer="' + t.answer + '">' +
            '<p class="task-text"><strong>' + (i+1) + '.</strong> ' + t.q + '</p>' +
            '<div class="answer-row">' +
              '<input type="text" class="answer-input" placeholder="Введите ответ...">' +
              '<button class="check-btn">Проверить</button>' +
            '</div>' +
            '<div class="answer-result"></div>' +
          '</div>';
      });
      tasksHTML += '</div>';
      scroll.insertAdjacentHTML('beforeend', tasksHTML);

      inner.appendChild(scroll);

      // Ручка ресайза
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.innerHTML =
        '<span class="resize-icon icon-up">▲</span>' +
        '<span class="resize-label">Потяните, чтобы изменить высоту</span>' +
        '<span class="resize-icon icon-down">▼</span>';
      inner.appendChild(handle);

      details.appendChild(inner);
      item.appendChild(details);
      section.appendChild(item);
    });

    root.appendChild(section);
  });

  /* ================================================================
     ИНТЕРАКТИВ
     ================================================================ */
  const items = document.querySelectorAll('.battle-item');

  /* Тема */
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const htmlEl = document.documentElement;

  function applyTheme(theme){
    htmlEl.setAttribute('data-theme', theme);
    themeIcon.textContent = (theme === 'dark') ? '☀️' : '🌙';
    try { localStorage.setItem('theme', theme); } catch(e){}
  }
  let saved = 'dark';
  try { saved = localStorage.getItem('theme') || 'dark'; } catch(e){}
  applyTheme(saved);

  themeToggle.addEventListener('click', function(){
    applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* Аккордеон */
  items.forEach(function(item){
    const header = item.querySelector('.battle-header');
    header.addEventListener('click', function(){
      const isOpen = item.classList.contains('open');
      items.forEach(function(other){
        if (other !== item) other.classList.remove('open');
      });
      item.classList.toggle('open', !isOpen);
    });
  });

  document.getElementById('expandAll').addEventListener('click', function(){
    items.forEach(function(i){ i.classList.add('open'); });
  });
  document.getElementById('collapseAll').addEventListener('click', function(){
    items.forEach(function(i){ i.classList.remove('open'); });
  });

  /* ================================================================
     РЕСАЙЗ С ЗАЩИТОЙ ОТ ПРОКРУТКИ СТРАНИЦЫ
     ================================================================ */
  document.querySelectorAll('.battle-item').forEach(function(item){
    const handle = item.querySelector('.resize-handle');
    const scrollContent = item.querySelector('.scroll-content');
    if(!handle || !scrollContent) return;

    let startY = 0;
    let startHeight = 0;
    let isDragging = false;

    function applyDelta(clientY){
      const dy = clientY - startY;
      let newHeight = startHeight + dy;
      if(newHeight < 150) newHeight = 150;
      if(newHeight > 1500) newHeight = 1500;
      scrollContent.style.maxHeight = newHeight + 'px';
    }

    /* --- Мышь --- */
    handle.addEventListener('mousedown', function(e){
      e.preventDefault();
      isDragging = true;
      startY = e.clientY;
      startHeight = scrollContent.offsetHeight;
      handle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ns-resize';
    });

    document.addEventListener('mousemove', function(e){
      if(!isDragging) return;
      applyDelta(e.clientY);
    });

    document.addEventListener('mouseup', function(){
      if(!isDragging) return;
      isDragging = false;
      handle.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
    });

    /* --- Касание (главное исправление) --- */
    handle.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      // Ключевое: preventDefault блокирует прокрутку страницы
      e.preventDefault();
      isDragging = true;
      startY = e.touches[0].clientY;
      startHeight = scrollContent.offsetHeight;
      handle.classList.add('dragging');
    }, {passive: false});

    document.addEventListener('touchmove', function(e){
      if(!isDragging || e.touches.length !== 1) return;
      // Ключевое: preventDefault блокирует прокрутку страницы
      e.preventDefault();
      applyDelta(e.touches[0].clientY);
    }, {passive: false});

    document.addEventListener('touchend', function(){
      if(!isDragging) return;
      isDragging = false;
      handle.classList.remove('dragging');
    });

    document.addEventListener('touchcancel', function(){
      if(!isDragging) return;
      isDragging = false;
      handle.classList.remove('dragging');
    });
  });

  /* ================================================================
     ПРОВЕРКА ОТВЕТОВ
     ================================================================ */
  function normalize(str){
    return str
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[«»"']/g, '')
      .replace(/\s+/g, ' ')
      .replace(/[.,;:!?]/g, '')
      .trim();
  }

  document.querySelectorAll('.fipi-task').forEach(function(task){
    const input = task.querySelector('.answer-input');
    const btn = task.querySelector('.check-btn');
    const result = task.querySelector('.answer-result');
    const correctAnswers = task.getAttribute('data-answer').split('|');

    function check(){
      const userAnswer = normalize(input.value);
      if(!userAnswer){
        result.className = 'answer-result show fail';
        result.innerHTML = '<span class="label">⚠️</span> Введите ответ.';
        return;
      }
      const isCorrect = correctAnswers.some(function(ans){
        return normalize(ans) === userAnswer;
      });
      input.classList.remove('correct', 'wrong');
      if(isCorrect){
        input.classList.add('correct');
        result.className = 'answer-result show ok';
        result.innerHTML = '<span class="label">✅ Верно!</span>';
      } else {
        input.classList.add('wrong');
        result.className = 'answer-result show fail';
        result.innerHTML = '<span class="label">❌ Неверно.</span> Правильный ответ: <strong>' +
          correctAnswers[0] + '</strong>';
      }
    }

    btn.addEventListener('click', check);
    input.addEventListener('keypress', function(e){
      if(e.key === 'Enter') check();
    });
    input.addEventListener('input', function(){
      input.classList.remove('correct', 'wrong');
      result.className = 'answer-result';
      result.innerHTML = '';
    });
  });

})();
